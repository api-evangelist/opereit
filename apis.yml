aid: opereit
name: Opereit
description: >-
  Opereit is a Barcelona-based logistics technology company building AI agents
  that audit, claim, and recover logistics costs autonomously. Its agents detect
  carrier invoice discrepancies, identify lost and damaged shipments, and file
  carrier claims end to end with no human in the loop. The public Opereit Invoice
  Auditing API lets developers upload carrier contracts (rate cards and surcharges
  are extracted asynchronously), audit incoming carrier invoices against those
  contracts, and retrieve the resulting line items and discrepancy findings —
  building automated cost-recovery workflows without the dashboard. Opereit raised
  a ~$2.5M pre-seed round led by Seedcamp and Yellow in 2026.
